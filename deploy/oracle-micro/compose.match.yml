# Style match (the wizard project) alone on one Oracle Always Free VM.Standard.E2.1.Micro (AMD, 1 GB RAM),
# behind Caddy.
#
# upload.ps1 -Role match copies this file to ~/pantea/stack/docker-compose.yml, so on the server it is just:
#   cd ~/pantea/stack && docker compose up -d --build
#
# Measured: with the int8 CLIP model and these JVM limits the service peaks at ~400 MB, and its leave-one-out
# check over the theme photos gives exactly the same predictions as the full 350 MB model.

services:

  app:
    build:
      context: ../wizard
    image: pantea/style-match:1.0.0
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: >-
        -Xms64m -Xmx300m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss512k
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=2 -Djava.awt.headless=true
      MATCHER_API_KEY: ${API_KEY:?set API_KEY in .env}
      MATCHER_RATE_LIMIT: ${RATE_LIMIT:-20}
      MATCHER_MODELPATH: /app/models/clip-vit-base-patch32-vision-int8.onnx
    volumes:
      - ../data/models:/app/models
      - ../data/themes:/app/themes:ro
    expose:
      - "8085"
    networks: [web]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      UPSTREAM: app:8085
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [web]
    logging: *logging

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
